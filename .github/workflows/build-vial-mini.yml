name: Build Corne v4.1 mini (Vial)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install make
        run: |
          rm -f /etc/apt/sources.list.d/github-cli*
          apt-get update
          apt-get install -y make

      - name: Build Vial firmware (crkbd rev4_1 mini)
        run: |
          make vial-qmk-clean
          kb=crkbd make vial-qmk-init
          kb=crkbd kr=rev4_1/mini km=vial_mini make vial-qmk-compile

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: crkbd_rev4_1_mini_vial_mini
          path: |
            keyboards/crkbd/vial-kb/vial-qmk/.build/*.uf2
            keyboards/crkbd/vial-kb/vial-qmk/.build/*.hex
